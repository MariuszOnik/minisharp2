# Budowanie przy każdym pushu: testy PC, MiniSharp.3dsx i MiniSharp.apk.
# Dopóki w repo nie ma kodu danej części (etapy 1, 3, 5b), jej job tylko wypisuje komunikat i kończy się sukcesem.
# Push na main odświeża wydania "3ds-latest" i "android-latest" (do pobrania prosto na konsolę / telefon).

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-pc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testy na PC
        run: |
          if [ ! -f Makefile ]; then echo "::notice::Brak Makefile (etap 1) – pomijam testy PC"; exit 0; fi
          make test

  build-3ds:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Buduj MiniSharp.3dsx
        run: |
          if [ ! -d platform/3ds ]; then echo "::notice::Brak platform/3ds (etap 3) – pomijam build 3DS"; exit 0; fi
          make 3ds
          cp build/MiniSharp.3dsx MiniSharp.3dsx
      - uses: actions/upload-artifact@v4
        with:
          name: MiniSharp-3dsx
          path: MiniSharp.3dsx
          if-no-files-found: ignore

  # APK = wersja web (wasm) w WebView Androida, więc potrzebuje platform/web i folderu android/.
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Czy jest wersja na Androida?
        id: check
        run: |
          if [ -f android/prepare-assets.sh ] && [ -d platform/web ]; then echo "ok=1" >> "$GITHUB_OUTPUT"
          else echo "::notice::Brak android/ lub platform/web (etap 5b) – pomijam build APK"; fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.ok == '1'
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        if: steps.check.outputs.ok == '1'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.check.outputs.ok == '1'
        with:
          gradle-version: "8.9"
      - name: Buduj MiniSharp.apk
        if: steps.check.outputs.ok == '1'
        run: |
          pip install ziglang==0.17.0
          sh android/prepare-assets.sh
          gradle -p android assembleDebug --stacktrace
          cp android/app/build/outputs/apk/debug/app-debug.apk MiniSharp.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MiniSharp-apk
          path: MiniSharp.apk
          if-no-files-found: ignore

  # Ostatnie buildy z main jako wydania do pobrania (tylko gdy plik powstał).
  latest:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test-pc, build-3ds, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
      - name: Wydania 3ds-latest i android-latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          publish() { # tag plik tytuł opis
            [ -f "$2" ] || { echo "Brak $2 – pomijam $1"; return 0; }
            gh release delete "$1" --yes --cleanup-tag || true
            gh release create "$1" "$2" --target "$GITHUB_SHA" --title "$3" --notes "$4"
          }
          publish 3ds-latest MiniSharp-3dsx/MiniSharp.3dsx "MiniSharp na 3DS (ostatni build)" \
            "Skopiuj MiniSharp.3dsx do sdmc:/3ds/ i uruchom z Homebrew Launchera."
          publish android-latest MiniSharp-apk/MiniSharp.apk "MiniSharp na Androida (ostatni build)" \
            "Pobierz MiniSharp.apk i otwórz go na telefonie (Android zapyta raz o zgodę na instalację z tego źródła)."
